  };
  return html`<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-4">
    <div class="flex items-center justify-between"><h2 class="font-semibold text-lg">${editing?'Editar orden '+editing.orden:'Nueva orden de trabajo'}</h2>${editing&&html`<button class="btn bg-slate-100" onClick=${onCancel}>Cancelar edición</button>`}</div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <${Field} label="N° de orden"><input class="inp" type="number" value=${f.orden} onInput=${set('orden')}/><//>
      <${Field} label="Fecha"><input class="inp" type="date" value=${f.fecha} onInput=${set('fecha')}/><//>
      <${Field} label="Realizado / retirado por"><input class="inp" value=${f.realizadoPor} onInput=${set('realizadoPor')} placeholder="Juan"/><//>
      <${Field} label="N° siniestro"><input class="inp" value=${f.siniestro} onInput=${set('siniestro')}/><//>
      <${Field} label="Asegurado / cliente" cls="col-span-2"><input class="inp" value=${f.asegurado} onInput=${set('asegurado')}/><//>
      <${Field} label="Vehículo"><input class="inp" value=${f.vehiculo} onInput=${set('vehiculo')}/><//>
      <${Field} label="Chapa"><input class="inp" value=${f.chapa} onInput=${set('chapa')}/><//>
      <${Field} label="Color"><input class="inp" value=${f.color} onInput=${set('color')}/><//>
      <${Field} label="Observaciones" cls="col-span-2 md:col-span-3"><input class="inp" value=${f.obs} onInput=${set('obs')} placeholder="Aseguradora, pieza, etc."/><//>
    </div>
    <div class="rounded-lg bg-slate-50 border border-slate-200 p-3">
      <div class="grid grid-cols-2 md:grid-cols-5 gap-2 items-end">
        <${Field} label="Tipo"><select class="inp" value=${kind} onChange=${e=>{setKind(e.target.value);setCode('')}}><option value="paint">Pintura (gramos)</option><option value="prod">Producto / material</option></select><//>
        <${Field} label="Insumo" cls="col-span-2"><select class="inp" value=${code} onChange=${e=>setCode(e.target.value)}><option value="">Seleccionar…</option>${cat.map(c=>html`<option key=${c.code} value=${c.code}>${c.name} · stock ${c.stock}${kind==='paint'?' g':''} · ${kind==='paint'?gp(c.price):gs(c.price)}</option>`)}</select><//>
        <${Field} label=${kind==='paint'?'Gramos':'Cantidad'}><input class="inp" type="number" step=${kind==='paint'?1:0.05} min="0" value=${qty} onInput=${e=>setQty(e.target.value)}/><//>
        <button class="btn bg-blue-600 text-white col-span-2 md:col-span-1" onClick=${add}>+ Agregar</button>
      </div>
      ${f.items.length>0&&html`<div class="overflow-x-auto mt-3"><table class="w-full text-sm"><thead class="text-xs text-slate-500 text-left"><tr><th>Tipo</th><th>Insumo</th><th>Cant. (g en pintura)</th><th>Precio (pintura: Gs/g)</th><th class="text-right">Subtotal</th><th></th></tr></thead><tbody>
        ${f.items.map((it,i)=>html`<tr key=${i} class="border-t border-slate-200"><td class="py-1">${it.kind==='paint'?'🎨 Pintura':'🔧 Material'}</td><td>${it.name}</td>
          <td><input class="inp w-20" type="number" step=${it.kind==='paint'?1:0.05} value=${it.qty} onInput=${e=>setF({...f,items:f.items.map((x,j)=>j===i?{...x,qty:+e.target.value}:x)})}/></td>
          <td><input class="inp w-28" type="number" step=${it.kind==='paint'?0.01:1} value=${it.price} onInput=${e=>setF({...f,items:f.items.map((x,j)=>j===i?{...x,price:+e.target.value}:x)})}/></td>
          <td class="text-right font-medium">${gs(it.qty*it.price)}</td><td class="text-right"><button class="text-red-600 px-2" onClick=${()=>setF({...f,items:f.items.filter((_,j)=>j!==i)})}>✕</button></td></tr>`)}
      </tbody></table></div>`}
    </div>
    <div class="grid grid-cols-3 gap-3 text-center">
      <${Card} label="Materiales" value=${gs(t.m)}/><${Card} label="Pintura" value=${gs(t.p)}/><${Card} label="Total general" value=${gs(t.t)} color="text-blue-700"/>
    </div>
    ${err&&html`<div class="text-sm text-red-600">${err}</div>`}
    <button class="btn bg-blue-600 text-white w-full py-2.5" onClick=${save}>${editing?'Guardar cambios':'Registrar orden y descontar stock'}</button>
  </div>`;
}

function Summary({db,onEdit,onDelete}){
  const [month,setMonth]=useState(new Date().toISOString().slice(0,7));
  const [q,setQ]=useState('');const [who,setWho]=useState('');const [conf,setConf]=useState(null);
  const rows=useMemo(()=>db.orders.filter(o=>o.fecha.startsWith(month)).sort((a,b)=>a.orden-b.orden),[db.orders,month]);
  const vis=rows.filter(o=>(!who||o.realizadoPor===who)&&(!q||[o.orden,o.obs,o.asegurado,o.vehiculo,o.chapa,o.realizadoPor].join(' ').toLowerCase().includes(q.toLowerCase())));
  const T=vis.map(tot);
  return html`<div class="space-y-4">
    <div class="flex flex-wrap gap-3 items-end"><${Field} label="Mes / año"><input type="month" class="inp" value=${month} onInput=${e=>setMonth(e.target.value)}/><//>
      <${Field} label="Buscar" cls="flex-1 min-w-40"><input class="inp" placeholder="Orden, aseguradora, chapa…" value=${q} onInput=${e=>setQ(e.target.value)}/><//>
      <${Field} label="Realizado por"><select class="inp" value=${who} onChange=${e=>setWho(e.target.value)}><option value="">Todos</option>${[...new Set(rows.map(o=>o.realizadoPor).filter(Boolean))].map(w=>html`<option key=${w}>${w}</option>`)}</select><//></div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <${Card} label="Gasto en materiales" value=${gs(sum(T,t=>t.m))}/><${Card} label="Gasto en pintura" value=${gs(sum(T,t=>t.p))}/>
      <${Card} label="Costo global" value=${gs(sum(T,t=>t.t))} color="text-blue-700"/><${Card} label="Órdenes" value=${vis.length} sub=${vis.length?'Promedio '+gs(sum(T,t=>t.t)/vis.length):'Sin datos'}/>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto"><table class="w-full text-sm min-w-[760px]">
      <thead class="bg-slate-50 text-xs uppercase text-slate-500 text-left"><tr><th class="p-3">N°</th><th>Orden</th><th>Fecha</th><th class="text-right">Materiales</th><th class="text-right">Pintura</th><th class="text-right">Total</th><th class="pl-4">Realiz. por</th><th>Obs.</th><th></th></tr></thead>
      <tbody>${vis.map((o,i)=>{const t=T[i];return html`<tr key=${o.id} class="border-t border-slate-100 hover:bg-slate-50"><td class="p-3 text-slate-400">${i+1}</td><td class="font-semibold">${o.orden}</td><td>${o.fecha}</td><td class="text-right">${gs(t.m)}</td><td class="text-right">${gs(t.p)}</td><td class="text-right font-semibold">${gs(t.t)}</td><td class="pl-4">${(o.realizadoPor||'—').toUpperCase()}</td><td>${o.obs}</td>
        <td class="text-right whitespace-nowrap pr-3">${conf===o.id?html`<button class="btn bg-red-600 text-white" onClick=${()=>{onDelete(o);setConf(null)}}>Confirmar</button> <button class="btn bg-slate-100" onClick=${()=>setConf(null)}>No</button>`:html`<button class="text-blue-600 px-2" onClick=${()=>onEdit(o)}>Editar</button><button class="text-red-600 px-2" onClick=${()=>setConf(o.id)}>Eliminar</button>`}</td></tr>`})}
      ${!vis.length&&html`<tr><td colspan="9" class="p-8 text-center text-slate-400">No hay órdenes para este período.</td></tr>`}</tbody></table></div></div>`;
}

function Inventory({db,commit}){
  const [tab,setTab]=useState('paints');const [q,setQ]=useState('');const [n,setN]=useState({code:'',name:'',price:'',stock:'',min:''});
  const list=db[tab].filter(x=>(x.name+x.code).toLowerCase().includes(q.toLowerCase()));
  const unit=tab==='paints'?'g':'u.';
  const nlow=db[tab].filter(low).length;
  const upd=(x,patch,d)=>commit(s=>({...s,[tab]:s[tab].map(y=>y.code===x.code?{...y,...patch}:y)}),d);
  const add=()=>{if(!n.code||!n.name)return;if(db[tab].some(x=>x.code===n.code))return;
    commit(s=>({...s,[tab]:[...s[tab],{code:n.code.toUpperCase(),name:n.name,price:+n.price||0,stock:+n.stock||0,min:+n.min||0}]}),'Alta de '+n.name);setN({code:'',name:'',price:'',stock:'',min:''})};
  return html`<div class="space-y-4">
    <div class="flex flex-wrap gap-2 items-center"><div class="inline-flex rounded-lg bg-slate-200 p-1">${[['paints','🎨 Pinturas'],['products','🔧 Productos / insumos']].map(([k,l])=>html`<button key=${k} class=${'btn '+(tab===k?'bg-white shadow':'text-slate-600')} onClick=${()=>setTab(k)}>${l}</button>`)}</div>
      <input class="inp max-w-xs" placeholder="Buscar…" value=${q} onInput=${e=>setQ(e.target.value)}/>
      ${nlow>0&&html`<span class="text-sm font-semibold text-red-600 bg-red-50 border border-red-200 rounded-full px-3 py-1">⚠ ${nlow} con stock bajo</span>`}</div>
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto"><table class="w-full text-sm min-w-[680px]">
      <thead class="bg-slate-50 text-xs uppercase text-slate-500 text-left"><tr><th class="p-3">Código</th><th>Descripción</th><th>Estado</th><th>Stock (${unit})</th><th>Mínimo</th><th class="text-right">Precio${tab==='paints'?' / g':''}</th><th class="text-right pr-3">Valor</th></tr></thead>
      <tbody>${list.map(x=>{const st=x.min>0&&x.stock<=0?['Agotado','bg-red-600 text-white']:low(x)?['Stock bajo','bg-amber-100 text-amber-800']:x.stock<=0?['Sin stock','bg-slate-100 text-slate-500']:['OK','bg-emerald-100 text-emerald-800'];
        return html`<tr key=${x.code} class=${'border-t border-slate-100 '+(low(x)?'bg-red-50/50':'')}><td class="p-3 font-mono text-xs">${x.code}</td><td>${x.name}</td><td><span class=${'text-xs font-semibold rounded-full px-2 py-0.5 '+st[1]}>${st[0]}</span></td>
        <td><input key=${x.stock} class="inp w-24" type="number" step=${tab==='paints'?1:0.05} defaultValue=${x.stock} onBlur=${e=>{const v=+e.target.value;if(v!==x.stock&&v>=0)upd(x,{stock:v},'Ajuste de stock: '+x.name+' → '+v)}}/></td>
        <td><input key=${'m'+x.min} class="inp w-20" type="number" step=${tab==='paints'?1:0.05} defaultValue=${x.min} onBlur=${e=>{const v=+e.target.value;if(v!==x.min&&v>=0)upd(x,{min:v},'Mínimo de '+x.name+' → '+v)}}/></td>
        <td class="text-right">${tab==='paints'?gp(x.price):gs(x.price)}</td><td class="text-right pr-3">${gs(x.price*x.stock)}</td></tr>`})}</tbody></table></div>
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4"><h3 class="font-semibold mb-2">Dar de alta ${tab==='paints'?'una pintura':'un producto'}</h3>
      <div class="grid grid-cols-2 md:grid-cols-6 gap-2 items-end">
        <${Field} label="Código"><input class="inp" value=${n.code} onInput=${e=>setN({...n,code:e.target.value})}/><//>
        <${Field} label="Descripción" cls="md:col-span-2"><input class="inp" value=${n.name} onInput=${e=>setN({...n,name:e.target.value})}/><//>
        <${Field} label=${tab==='paints'?'Precio / gramo':'Precio'}><input class="inp" type="number" step="0.01" value=${n.price} onInput=${e=>setN({...n,price:e.target.value})}/><//>
        <${Field} label=${'Stock inicial'+(tab==='paints'?' (g)':'')}><input class="inp" type="number" value=${n.stock} onInput=${e=>setN({...n,stock:e.target.value})}/><//>
        <${Field} label="Mínimo"><input class="inp" type="number" value=${n.min} onInput=${e=>setN({...n,min:e.target.value})}/><//>
      </div><button class="btn bg-blue-600 text-white mt-3" onClick=${add}>+ Agregar al inventario</button></div></div>`;
}

function Settings({db,online,forceOff,setForceOff,sync,syncing,reset}){
  const [bk,setBk]=useState('');const [c,setC]=useState(false);const [msg,setMsg]=useState('');
  return html`<div class="grid md:grid-cols-2 gap-4">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-3"><h3 class="font-semibold">Estado de conexión</h3>
      <div class="text-lg">${online?'🟢 Conectado':'🟠 Trabajando offline'}</div>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" checked=${forceOff} onChange=${e=>setForceOff(e.target.checked)}/> Simular modo sin internet (para probar)</label>
      <p class="text-sm text-slate-500">Todo se guarda en este dispositivo (localStorage). Los cambios hechos sin conexión quedan en la cola y se envían al volver la red.</p>
      <div class="text-xs text-slate-500">Última sincronización: ${db.lastSync?new Date(db.lastSync).toLocaleString('es-PY'):'nunca'}</div></div>
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-3"><div class="flex items-center justify-between"><h3 class="font-semibold">Sincronización pendiente (${db.queue.length})</h3>
      <button disabled=${!online||syncing||!db.queue.length} class="btn bg-blue-600 text-white disabled:opacity-40" onClick=${sync}>${syncing?'Enviando…':'Sincronizar ahora'}</button></div>
      <ul class="text-sm divide-y divide-slate-100 max-h-60 overflow-y-auto">${db.queue.map(q=>html`<li key=${q.id} class="py-1.5 flex justify-between gap-2"><span>${q.desc}</span><span class="text-xs text-slate-400 whitespace-nowrap">${new Date(q.ts).toLocaleTimeString('es-PY')}</span></li>`)}
      ${!db.queue.length&&html`<li class="py-4 text-slate-400 text-center">Todo sincronizado ✔</li>`}</ul></div>
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-2 md:col-span-2"><h3 class="font-semibold">Respaldo y datos</h3>
      <textarea class="inp h-24 font-mono text-xs" value=${bk} onInput=${e=>setBk(e.target.value)} placeholder="Generá el respaldo (JSON) o pegá uno para restaurar"></textarea>
      <div class="flex flex-wrap gap-2"><button class="btn bg-slate-800 text-white" onClick=${()=>{setBk(JSON.stringify(db));setMsg('Respaldo generado: copialo y guardalo en un archivo.')}}>Generar respaldo</button>
        <button class="btn bg-slate-100" onClick=${()=>{try{const d=JSON.parse(bk);if(!d.orders||!d.paints||!d.products)throw 0;reset(d);setMsg('Datos restaurados.')}catch(e){setMsg('JSON inválido.')}}}>Restaurar</button>
        ${c?html`<button class="btn bg-red-600 text-white" onClick=${()=>{reset(seed());setC(false);setMsg('Datos históricos recargados.')}}>Confirmar: borrar todo</button>`:html`<button class="btn bg-red-50 text-red-700" onClick=${()=>setC(true)}>Restablecer a datos históricos importados</button>`}</div>
      ${msg&&html`<div class="text-sm text-slate-600">${msg}</div>`}</div></div>`;
}

function App(){
  const [db,setDb]=useState(load);const [tab,setTab]=useState('orders');const [editing,setEditing]=useState(null);
  const [net,setNet]=useState(navigator.onLine);const [forceOff,setForceOff]=useState(false);const [syncing,setSyncing]=useState(false);
  const online=net&&!forceOff;
  useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}},[db]);
  useEffect(()=>{const a=()=>setNet(true),b=()=>setNet(false);addEventListener('online',a);addEventListener('offline',b);return()=>{removeEventListener('online',a);removeEventListener('offline',b)}},[]);
  const commit=(fn,desc)=>setDb(d=>{const n=fn(d);return{...n,queue:[{id:uid(),ts:Date.now(),desc},...n.queue]}});
  const sync=()=>{if(!online||syncing)return;setSyncing(true);setTimeout(()=>{setDb(d=>({...d,queue:[],lastSync:Date.now()}));setSyncing(false)},900)};
  useEffect(()=>{if(online&&db.queue.length&&!syncing)sync()},[online]);
  const save=o=>{commit(d=>{let n=d;if(editing){const old=d.orders.find(x=>x.id===editing.id);if(!old.hist)n=applyStock(n,old.items,+1);n={...n,orders:n.orders.map(x=>x.id===editing.id?o:x)}}else n={...n,orders:[o,...n.orders]};return o.hist?n:applyStock(n,o.items,-1)},(editing?'Orden editada #':'Orden registrada #')+o.orden);setEditing(null)};
  const del=o=>commit(d=>{const n={...d,orders:d.orders.filter(x=>x.id!==o.id)};return o.hist?n:applyStock(n,o.items,+1)},'Orden eliminada #'+o.orden);
  const tabs=[['orders','📋 Órdenes'],['summary','📊 Resumen mensual'],['inventory','📦 Inventario'],['settings','⚙️ Configuración / Offline']];
  const lowN=db.paints.concat(db.products).filter(low).length;
  return html`<div class="max-w-6xl mx-auto p-3 md:p-6 space-y-4">
    <header class="flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-xl md:text-2xl font-bold">Vimed Car Service</h1><p class="text-sm text-slate-500">Control de órdenes, pintura e insumos · taller de chapa y pintura</p></div>
      <div class="flex items-center gap-2 text-sm"><span class=${'rounded-full px-3 py-1 font-semibold '+(online?'bg-emerald-100 text-emerald-800':'bg-orange-100 text-orange-800')}>${online?'🟢 Conectado':'🟠 Trabajando offline'}</span>
        <button class="rounded-full px-3 py-1 font-semibold bg-white border border-slate-300" onClick=${()=>setTab('settings')}>⟳ ${db.queue.length} pendiente${db.queue.length===1?'':'s'}</button></div></header>
    <nav class="flex gap-1 overflow-x-auto bg-slate-200 p-1 rounded-xl">${tabs.map(([k,l])=>html`<button key=${k} class=${'btn whitespace-nowrap '+(tab===k?'bg-white shadow text-blue-700':'text-slate-600')} onClick=${()=>setTab(k)}>${l}${k==='inventory'&&lowN>0?html` <span class="bg-red-600 text-white rounded-full text-xs px-1.5">${lowN}</span>`:''}</button>`)}</nav>
    ${tab==='orders'&&html`<${OrderForm} db=${db} editing=${editing} onSave=${save} onCancel=${()=>setEditing(null)}/>`}
    ${tab==='summary'&&html`<${Summary} db=${db} onEdit=${o=>{setEditing(o);setTab('orders')}} onDelete=${del}/>`}
    ${tab==='inventory'&&html`<${Inventory} db=${db} commit=${commit}/>`}
    ${tab==='settings'&&html`<${Settings} db=${db} online=${online} forceOff=${forceOff} setForceOff=${setForceOff} sync=${sync} syncing=${syncing} reset=${d=>setDb({...d,queue:d.queue||[]})}/>`}
  </div>`;
}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
